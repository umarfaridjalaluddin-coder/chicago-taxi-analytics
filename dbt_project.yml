name: 'taxi_analytics'
version: '1.0.0'
config-version: 2

profile: 'taxi_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  taxi_analytics:

    staging:
      +materialized: view

    intermediate:
      +materialized: table

    marts:
      +materialized: table

seeds:
  taxi_analytics:
    +quote_columns: false